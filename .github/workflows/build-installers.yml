name: Build Installers (Win + Mac Intel + Mac Selicon)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # --- ЗАДАЧА ДЛЯ WINDOWS ---
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew
        shell: bash

      - name: Build with Gradle
        run: ./gradlew clean jpackage
        shell: bash

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: build/jpackage/*.exe

  # --- ЗАДАЧА ДЛЯ MAC (INTEL x86_64) ---
  build-mac-intel:
    runs-on: macos-15-intel  # macos-15-intel гарантированно работает на архитектуре x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle (Mac)
        run: ./gradlew clean jpackage

      # --- ШАГ ОТЛАДКИ: Покажет, что реально создалось ---
      - name: List build directory (Debug)
        run: ls -R build

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Installer-Intel
          # Ищем .pkg или .dmg
          path: build/jpackage/*

  # --- ЗАДАЧА ДЛЯ MAC (Apple Silicon (arm64)) ---
  build-mac-silicon:
    runs-on: macos-26  # The standard macos-26 label runs on Apple Silicon (arm64).
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle (Mac)
        run: ./gradlew clean jpackage

      # --- ШАГ ОТЛАДКИ: Покажет, что реально создалось ---
      - name: List build directory (Debug)
        run: ls -R build

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Installer-Silicon
          # Ищем .pkg или .dmg
          path: build/jpackage/*